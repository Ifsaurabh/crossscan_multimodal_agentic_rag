name: Docker image check (pull requests)

# Builds the production image and starts it, so a broken Dockerfile, a missing model or a bad
# requirements change is found in the pull request, not at deploy time. Nothing is pushed anywhere.
# Runs only when something that can break the image changes.

on:
  pull_request:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "src/embedding_config.py"
      - "src/retrieval_config.py"
      - "src/chat_app.py"
      - ".github/workflows/docker-build.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space (the image is several GB and Docker needs room to build it)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Build the image (this also proves both models load offline - see the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: crossscan:ci

      - name: Start the container and check it is healthy
        run: |
          docker run -d --name crossscan -p 8000:8000 crossscan:ci
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
               --max-time 20 http://localhost:8000/_stcore/health
          echo

      - name: The container must never try to reach the model hub
        run: docker exec crossscan sh -c 'test "$HF_HUB_OFFLINE" = "1" && test "$TRANSFORMERS_OFFLINE" = "1"'

      - name: Show the container log if anything failed
        if: failure()
        run: docker logs crossscan || true
