version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Groups routine patch/minor bumps into one PR instead of one per package;
    # a major bump (torch, transformers etc.) still gets its own PR to review carefully.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The base image in the Dockerfile (python:3.11-slim): security patches arrive as a PR, and the
  # Docker image check workflow proves the new base still builds before it is merged.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
