version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Groups routine patch/minor bumps into one PR instead of one per package;
    # a major bump (torch, transformers etc.) still gets its own PR to review carefully.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    # These two are pinned TOGETHER on purpose: ragas needs instructor>=1.9 (for Gemini), but every
    # instructor release newer than 1.12 needs openai 3.x, while the app is pinned to openai 1.x.
    # Bumping either one alone makes pip's resolver fail (that is what the openai 3.19.2 PR did), so
    # they are moved by hand, together, when ragas supports it.
    ignore:
      - dependency-name: "openai"
      - dependency-name: "instructor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # The base image in the Dockerfile (python:3.11-slim): security patches arrive as a PR, and the
  # Docker image check workflow proves the new base still builds before it is merged.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
